services:
  regit:
    build: .
    ports:
      - "127.0.0.1:8377:8377"
    volumes:
      - regit_data:/data
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8377/api/health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  regit_data:
